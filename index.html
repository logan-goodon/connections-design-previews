<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080914">
<meta name="robots" content="noindex,nofollow">
<title>Connections · Three design directions</title>
<link rel="stylesheet" href="directions.css?v=3">
<script src="directions.js?v=3" defer></script>
</head>
<body data-theme="arcade">
<header class="preview-bar">
<div class="preview-caption"><span>CONNECTIONS / DESIGN LAB</span><span>Sample data · v3</span></div>
<nav class="design-picker" aria-label="Design direction"><button data-theme-choice="arcade"><span>A</span>Purple Arcade</button><button data-theme-choice="clubhouse"><span>B</span>Electric Clubhouse</button><button data-theme-choice="afterhours"><span>C</span>After Hours</button></nav>
<details class="preview-controls"><summary>Preview controls</summary><div class="control-fields"><label>View as<select id="role"><option value="owner">Owner</option><option value="member">Member</option></select></label><label>Today’s state<select id="game-state"><option value="complete">Perfect finish</option><option value="unplayed">Not played</option><option value="playing">Try the board</option></select></label><button id="sound" aria-pressed="false">Sound off</button></div><p>Everything here is fictional. No real games are saved. Sound is optional; reduced-motion settings are respected.</p></details>
</header>
<main class="phone" id="app"></main>
<dialog id="details" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Close dialog">✕</button></div><div id="dialog-content"></div></dialog>
<div id="notice" role="status" hidden></div>
<noscript>This clickable preview needs JavaScript enabled.</noscript>
</body>
</html>
